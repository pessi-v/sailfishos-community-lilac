# 2026-10-06: defaultuser's own XDG config dir (and its dconf/ subdirectory) do not exist on a
# genuinely fresh /home/defaultuser -- /etc/skel ships Pictures/Videos only, nothing creates
# ~/.config itself before the first user-session service needs it. Confirmed live: the very
# first real UI reached on this port, jolla-startupwizard-pre-user-session, crashes the whole
# user session right after the EULA/language steps try to persist a setting via dconf
# ("failed to create file '/home/defaultuser/.config/dconf/user.XXXXXX': No such file or
# directory"), and systemd then rate-limits user@100000.service's restart, which from the
# screen just looks like the wizard repeatedly resetting to the first page. dconf (like most
# GLib-based apps) does not recursively create its own parent ~/.config -- it only ever
# g_mkdir()s its own leaf directory, assuming the parent already exists. Guarantee both exist,
# every boot, before any user-session unit starts (systemd-tmpfiles-setup.service runs well
# before user@.service). Numeric uid/gid (not names) because tmpfiles rules can run before NSS
# name resolution is reliably available this early in boot.
d /home/defaultuser/.config 0755 100000 100000 -
d /home/defaultuser/.config/dconf 0755 100000 100000 -
