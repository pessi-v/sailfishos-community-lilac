# 2026-10-06, same night as lilac-defaultuser-config-dir.conf, same underlying pattern: Qt's
# QML LocalStorage (SQLite-backed, used by CSD's own TestCaseListModel to persist its test
# list/results) hits the identical "parent directory doesn't exist" gap as dconf did --
# confirmed live: CSD launched fine, but its test list stayed completely empty, logging
# `LocalStorage: can't create path - "/home/defaultuser/.local/share/org.sailfishos/csd/QML/
# OfflineStorage/Databases"` followed by `QSqlQuery::prepare: database not open`. Same root
# cause as the dconf bug: /etc/skel ships Pictures/Videos only, nothing creates
# ~/.local/share/org.sailfishos itself, and the app's own LocalStorage init only creates its
# own leaf directory, not the whole chain up to it.
#
# Every other QML app that uses LocalStorage under the org.sailfishos namespace (Settings,
# other first-party apps) will hit this identical gap the first time it runs on a genuinely
# fresh /home/defaultuser -- rather than add one more tmpfiles line per app as each is found
# the hard way, create the shared org.sailfishos parent here so each app's own (non-recursive)
# mkdir of its own one leaf subdirectory succeeds on its own. CSD's own specific path is still
# listed explicitly too, since it's the one already confirmed to need it tonight.
d /home/defaultuser/.local/share/org.sailfishos 0755 100000 100000 -
d /home/defaultuser/.local/share/org.sailfishos/csd 0755 100000 100000 -
d /home/defaultuser/.local/share/org.sailfishos/csd/QML 0755 100000 100000 -
d /home/defaultuser/.local/share/org.sailfishos/csd/QML/OfflineStorage 0755 100000 100000 -
d /home/defaultuser/.local/share/org.sailfishos/csd/QML/OfflineStorage/Databases 0755 100000 100000 -
