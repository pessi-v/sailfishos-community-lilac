[Service]
# 2026-10-01: same bug as lipstick.service.d/60-force-hwc2.conf (see that file for the full
# writeup), hit for the first time on the new 32GB card's first-ever boot -- this port had
# never previously reached the first-boot startup wizard with a clean /data, so this unit's
# own copy of the bug went unnoticed until now. jolla-startupwizard-pre-user-session links the
# same Qt QPA hwcomposer plugin as lipstick (confirmed via /proc/<pid>/maps -- both pull in
# liblipstick-qt5.so, libhwc2_compat_layer.so, qt5/plugins/platforms/libhwcomposer.so) and runs
# before lipstick.service ever starts on a fresh /data (ConditionPathExists=!%h/.jolla-
# startupwizard-done), so it hits the identical DRM-master-grab deadlock lipstick.service.d
# already works around -- confirmed live: process alive with the full graphics stack loaded,
# but /sys/class/drm/card0-DSI-1/enabled stayed "disabled" and both backlight devices read
# actual_brightness=0, the exact §37-42/§69 signature.
Environment=QT_QPA_FORCE_HWC2=1
ExecStartPre=/usr/bin/setprop ctl.restart vendor.hwcomposer-2-3
