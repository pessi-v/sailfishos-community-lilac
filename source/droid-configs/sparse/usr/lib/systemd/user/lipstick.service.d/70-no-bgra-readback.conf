# Screenshots: the Adreno 540 driver advertises GL_EXT_read_format_bgra but rejects
# BGRA glReadPixels, and Qt 5.6's grabWindow() trusts the extension, so every lipstick
# screenshot came back empty. The preload hides that one extension from lipstick so Qt
# uses its working RGBA path. Source: patches/lilac-no-bgra-readback/. The proper fix is adding this GPU to Qt's BGRA blacklist in qtbase.
# lipstick is setgid (group privileged), so glibc's secure-execution rules apply: the
# preload must be a bare name from a standard library dir, and the library itself must
# be mode 4755 (set by droid-config-lilac's %triggerin -- git can't record it).
[Service]
Environment=LD_PRELOAD=liblilac-no-bgra-readback.so
