[Service]
# lipstick's Qt QPA hwcomposer plugin does two incompatible things in
# sequence on this Android-10/11-era msm8998 vendor image -- hw_get_module()+methods->open()
# instantiates a second, in-process SDM stack that opens /dev/dri/card0 and takes DRM master
# (this is what "== hwcomposer device ==" in its own log means), then hwc2_compat_device_new()
# tries to talk to the real android.hardware.graphics.composer@N.N::IComposer HIDL service --
# which can never start, because lipstick itself now holds the DRM master it needs. Neither
# service-start order breaks the cycle; confirmed independently on this same device (lilac) by
# an earlier porting attempt (xperia-xz1-compact-lilac-sailfishos)
# and matching this port's own logcat: lipstick opens both hwcomposer.msm8998.so directly AND
# libhwc2.so.1 (the HIDL-client compat layer) in the same process.
#
# QT_QPA_FORCE_HWC2 is already built into qt5-qpa-hwcomposer-plugin
# (hwcomposer_backend.cpp, HWC_PLUGIN_HAVE_HWCOMPOSER2_API branch) specifically for this case --
# it skips methods->open() entirely for HWC2-capable modules and goes straight to
# hwc2_compat_device_new(), so lipstick never takes DRM master and the real composer service
# (vendor.hwcomposer-2-3 on this device) can start and own the display normally. No plugin
# rebuild needed -- this is a stock, already-shipped escape hatch, just never enabled here.
Environment=QT_QPA_FORCE_HWC2=1

# 2026-09-22, same session: QT_QPA_FORCE_HWC2 alone stopped the "library ... not found"/DRM-
# master-grab failure mode, but exposed a second, real bug underneath it: once any one
# `lipstick` attempt in a boot crashes, every later attempt in that *same* boot fails
# identically -- not from its own cause, but because the real composer service never released
# the previous (crashed) client:
#
#   android.hardware.graphics.composer@2.3-service: previous client was not destroyed
#   lipstick: F HwcComposer: failed to create composer client        <- 1ms later, same boot
#
# This explains the whole night's apparent intermittency in hindsight: most "identical repeat
# failures" within one boot were never independent -- only the first crash in a boot has its
# own real cause; every later one is this same stale-client poisoning. Confirmed with `readelf`
# not attempted here (closed-source vendor blob) -- fixed pragmatically instead: force a clean
# composer client on every single launch by restarting the real service first, the same
# `ctl.restart` property-trigger mechanism droid-hal-init's own init.rc uses internally.
ExecStartPre=/usr/bin/setprop ctl.restart vendor.hwcomposer-2-3

# 2026-10-06/07: a second, separate HAL dependency lipstick blocks on forever if it isn't
# already running -- found via `strace -p <lipstick PID>` on a boot where lipstick sat in
# `activating` for good, retrying once a second, never crashing and never logging anything
# past "Could not start the orientation sensor": `getService: Trying again for android.
# hardware.graphics.allocator@3.0::IAllocator/default...`. Unlike `vendor.hwcomposer-2-3`
# above, *nothing* on this device ever starts `vendor.qti.hardware.display.allocator-service`
# by name -- its own .rc is `class hal animation`, the same class as the composer service, but
# this hybrid boot's `class_start` never fires automatically for either (the same gap
# `lilac-coproc-bringup.sh`/`droid-late-start.service` already work around for the `core`/
# `late_start` classes) -- composer only ever runs because this same drop-in's own
# `ctl.restart` line above starts it explicitly by name every time; the allocator service has
# never had an equivalent trigger anywhere in this project, so it simply never starts at all on
# a boot where nothing else happens to need it first. `ctl.start` (not `ctl.restart`) is the
# right property here: idempotent/safe if the service is already running (a harmless no-op),
# unlike `ctl.restart`, which would kill and reopen the shared gralloc/allocator connection
# every single `lipstick` (re)start for a service nothing else needs restarted.
ExecStartPre=/usr/bin/setprop ctl.start vendor.qti.hardware.display.allocator
