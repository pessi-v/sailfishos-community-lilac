[Unit]
# systemd-udev-settle.service can never succeed on this device: a continuous kernel uevent
# storm from usbpd0/qpnp-smb2 power-supply status (re-firing every ~80-100ms, indefinitely,
# confirmed via `udevadm monitor --kernel`) means udev never catches up to a queue that keeps
# growing faster than it can drain. It reliably hits its 120s default timeout every boot.
#
# The base unit's Wants=systemd-udev-settle.service was empirically confirmed (PORTING-
# NOTES.md section 33) to cascade that repeated timeout into droid-hal-init itself
# restarting roughly every two minutes, wiping the whole Android-side environment
# (servicemanager, hwservicemanager, every lazy-started HAL) out from under anything
# already connected to it -- including whatever `lipstick`'s own hwcomposer connection was
# doing at the time.
#
# Clearing just Wants= (not After=) is the surgical fix: keeping After=...systemd-udev-
# settle.service... still orders droid-hal-init to start only once udev-settle has reached
# *some* terminal state (matters for hwservicemanager's own lazy ctl.interface_start
# mechanism to work correctly -- confirmed empirically that dropping After= too, not just
# Wants=, breaks composer's lazy trigger from ever firing at all, a real regression caught
# and reverted the same session). Dropping only Wants= removes the activation/restart
# coupling while preserving the ordering relationship droid-hal-init actually needs.
Wants=
