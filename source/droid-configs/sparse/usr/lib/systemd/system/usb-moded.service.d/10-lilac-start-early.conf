# usb-moded declares Wants=systemd-udev-settle.service, which on this port only gives up after its timeout: usb-moded then started
# about two minutes after boot, so a cable plugged in early got no USB mode. Drop the dependency (keeping the other orderings), and
# wait until Android's init has created the USB gadget, which usb-moded needs at startup.
# No Before= or After= on anything of the Android side, so no ordering cycle is possible.
[Unit]
Wants=
After=
After=local-fs.target dbus.socket

[Service]
TimeoutSec=90
ExecStartPre=-/bin/sh -c 'i=0; while [ ! -e /config/usb_gadget/g1/UDC ] && [ "$i" -lt 60 ]; do sleep 1; i=$((i+1)); done'
