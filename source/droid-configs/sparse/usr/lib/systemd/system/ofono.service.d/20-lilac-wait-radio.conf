# lilac: ofonod must not start before the Android radio HAL (qcrild) has registered
# android.hardware.radio@1.5::IRadio/slot1 with hwservicemanager. qcrild registers it ~35-40 s after
# droid-hal-init is up. ofono-binder-plugin only connects to IRadioConfig if it starts earlier and
# never picks up the late IRadio/slot1 registration (gbinder logs "Unhandled transaction
# android.hidl.manager@1.0::IServiceNotification"), so ofono ends up with 0 modems until it is
# restarted by hand. Wait up to 5 minutes, then start anyway.
[Service]
ExecStartPre=/bin/sh -c 'i=0; while [ $i -lt 150 ]; do /system/bin/lshal 2>/dev/null | grep -q "android.hardware.radio@1.5::IRadio/slot1" && exit 0; i=$((i+1)); sleep 2; done; exit 0'
TimeoutStartSec=400
