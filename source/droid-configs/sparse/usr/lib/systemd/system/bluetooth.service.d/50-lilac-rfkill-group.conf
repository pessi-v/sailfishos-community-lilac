[Service]
# bluetoothd's CapabilityBoundingSet (main unit) drops
# CAP_DAC_OVERRIDE, so its nominal root privilege doesn't bypass normal file permission
# checks. /dev/rfkill is group "bluetooth" (crw-rw----), and this unit was never a member
# of that group -- confirmed live: "src/rfkill.c:rfkill_init() Failed to open RFKILL
# control device: Permission denied" on every start. Without rfkill access, bluetoothd
# can never see hci0's own rfkill soft-block state change and never registers it as a
# usable org.bluez.Adapter1, even once the adapter itself is genuinely up. Same shape of
# gap as the existing uhid.conf drop-in (SupplementaryGroups=uhid) for /dev/uhid.
SupplementaryGroups=bluetooth
