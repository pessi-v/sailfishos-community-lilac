# Hardware feature declarations for lilac (Sony Xperia XZ1 Compact, G8441).
#
# Read by ssusysinfo, which globs /usr/share/csd/settings.d/*hw-settings*.ini,
# and surfaced to the UI through DeviceInfo::hasFeature() in
# nemo-qml-plugin-systemsettings (which links libssusysinfo).
#
# Without this file ssusysinfo reports only Feature_Suspend and Feature_Reboot,
# so every feature-gated UI element stays hidden.  That is why there was no
# battery indicator at all: Sailfish/Lipstick/BatteryStatusIndicator.qml line 24
# reads
#     visible: deviceInfo.hasFeature(DeviceInfo.FeatureBattery)
# This exact file (same device, same fix) was
# already worked out and verified in the sibling porting attempt's own repo
# (xperia-xz1-compact-lilac-sailfishos, no -v2) at mined
# from there rather than re-derived from scratch.
#
# Format note: the section is lowercase [features] and values are 1/0.  Section
# names like [General]/[Features]/[HwFeatures] and value lists are all silently
# ignored -- the file is read but nothing is picked up.
#
# These declare HARDWARE PRESENCE.  Since no file existed before, adding entries
# can only reveal UI, never hide working UI.  Entries marked "unverified" are
# real hardware whose software support has not been confirmed on this port yet.
[features]

# --- verified working on this port ---
Battery=1
Wifi=1
SDCard=1
Touch=1
LCD=1
Backlight=1
BackCameraFlash=1

# --- present hardware, standard on this device ---
AudioMic1=1
AudioMic2=1
BackCamera=1
FrontCamera=1
Headset=1
Key=1
Loudspeaker=1
StereoLoudspeaker=1
Receiver=1
Vibrator=1
LED=1
UsbCharging=1
UsbOtg=1
SIM=1
Bluetooth=1

# --- sensors (hybris-libsensorfw-qt5 is installed) ---
GSensor=1
Gyro=1
ECompass=1
ProxSensor=1
LightSensor=1

# --- present hardware, software unverified on this port ---
NFC=1
GPS=1
Fingerprint=1
CellularVoice=1
CellularData=1
CellInfo=1
BluetoothTethering=1

# --- not present on this device ---
FmRadio=0
FrontCameraFlash=0
TOH=0
Hall=0
TouchAuto=0
