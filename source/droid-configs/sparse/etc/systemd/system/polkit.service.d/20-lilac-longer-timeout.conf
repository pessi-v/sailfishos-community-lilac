# lilac-v2: a systemd drop-in override, not an edit to the real (package-owned)
# /usr/lib/systemd/system/polkit.service -- same convention as the sensorfwd.service.d
# drop-in in this repo.
#
# polkit.service is marginal under this device's heavy
# boot-time CPU/IO contention -- observed taking 21s on one boot (just inside the default
# 30s TimeoutStartSec) and 53-70s on another (killed by the timeout). When polkit.service
# fails, udisks2.service and systemd-hostnamed.service fail right along with it, since both
# need org.freedesktop.PolicyKit1 on the system bus. Give it real room instead of racing it.
[Service]
TimeoutStartSec=120
