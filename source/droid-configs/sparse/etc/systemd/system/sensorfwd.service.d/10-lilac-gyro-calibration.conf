# lilac-v2: a systemd drop-in override, not an edit to the
# real (package-owned) /usr/lib/systemd/system/sensorfwd.service, matching this whole project's
# own convention of never editing another package's files directly.
#
# sensorfwd's own real unit sets `ProtectSystem=full`, which makes /etc read-only for this
# service specifically via a systemd mount-namespace sandbox -- independent of, and stricter
# than, plain Unix file permissions (confirmed directly: `echo test > /etc/sensorfw/...` works
# fine over a plain root SSH shell, but the exact same path write from inside sensorfwd itself
# failed with "Could not write gyroscope calibration to ..."). patch-sensorfw-gyro-autocal.py's
# own live auto-calibration needs to persist to /etc/sensorfw/sensord.conf.d/ from inside
# sensorfwd -- punch a hole through ProtectSystem=full for exactly that one directory, nothing
# broader.
[Service]
ReadWritePaths=/etc/sensorfw/sensord.conf.d
