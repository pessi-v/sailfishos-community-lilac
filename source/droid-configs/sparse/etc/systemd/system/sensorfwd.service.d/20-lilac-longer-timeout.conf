# lilac-v2: a systemd drop-in override, not an edit to the real (package-owned)
# /usr/lib/systemd/system/sensorfwd.service -- same convention as the sibling
# 10-lilac-gyro-calibration.conf drop-in in this same directory.
#
# once sensorfwd's own HAL-loading gaps are actually fixed
# (sections 109/110/133 -- sensors.qti, android.hardware.sensors@2.0.so, ro.hardware.sensors),
# it reliably takes longer than the default 90s DefaultTimeoutStartSec to finish its own
# startup (registry setup against every real sensor backend for the first time, rather than
# failing out after a handful of quick, doomed probes the way it always had before) --
# confirmed live, no error output at all during the extra time, just systemd killing a process
# that was still making progress. Give it real room instead of racing it.
[Service]
TimeoutStartSec=120
