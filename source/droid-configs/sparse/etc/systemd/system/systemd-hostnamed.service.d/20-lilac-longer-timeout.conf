# lilac-v2: a systemd drop-in override, not an edit to the real (package-owned)
# /usr/lib/systemd/system/systemd-hostnamed.service -- same convention as the
# sensorfwd.service.d and polkit.service.d drop-ins in this repo.
#
# systemd-hostnamed.service has the same marginal-startup
# problem as polkit.service, independently of it -- confirmed failing on its own even
# after polkit.service was already up, and confirmed fixed by the same timeout bump
# (took 70s to start once given room). Give it real room instead of racing it.
[Service]
TimeoutStartSec=120
