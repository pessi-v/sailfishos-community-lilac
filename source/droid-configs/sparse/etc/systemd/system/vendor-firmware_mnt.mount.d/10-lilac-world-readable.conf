# The Android fstab options (dmask=227,fmask=337) make the modem partition readable by uid/gid 1000 only.
# The kernel loads the Venus firmware (venus.mdt) with the credentials of the process that opens the video
# device (media.codec runs as uid 1013), so request_firmware() fails with -13 and the video core never boots:
# no hardware video encoder, recording hangs. The partition holds firmware only.
[Mount]
Options=ro,shortname=lower,uid=1000,gid=1000,dmask=022,fmask=022
