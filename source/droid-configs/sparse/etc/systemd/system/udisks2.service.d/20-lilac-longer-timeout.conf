# lilac-v2: a systemd drop-in override, not an edit to the real (package-owned)
# /usr/lib/systemd/system/udisks2.service -- same convention as polkit.service.d here
#
# 2026-10-07: on a cold boot of the rebuilt image, udisks2.service was killed by the default
# 30s TimeoutStartSec even though polkit.service (already given 120s) was fine: udisks2 starts
# at the same moment as polkit, but needs org.freedesktop.PolicyKit1 on the bus, which polkit
# only registered ~25s later under this device's heavy boot-time load. udisksd had in fact
# acquired its own bus name at 15:32:00, one second after systemd gave up on it at 15:31:59.
# Started by hand afterward it came up fine -- a pure timeout, not an error.
[Service]
TimeoutStartSec=120
