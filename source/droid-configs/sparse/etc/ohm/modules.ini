# The OHM system modules configuration file
#
# lilac: the "accessories" plugin must run -- it turns the codec jack events
# (input "msm8998-tasha-snd-card Headset Jack") into the policy facts that move
# pulseaudio to output-wired_headset. The stock template bans it.

[Modules]
PerformExtraChecks=true
ModulesBanned=gconf
ModulesSuggested=
ModulesRequired=*
