# lilac-v2: gyroscope zero-rate bias correction.
#
# This device's own vendor HAL/SLPI never applies its own bias correction (a genuine,
# uncalibrated single-axis offset, confirmed live via CSD's own gyroscope verification test:
# Z read -2.2486 deg/s stationary, outside CSD's own +-1.3 deg/s pass window, while X/Y were
# fine). patches/patch-sensorfw-gyro-bias-calibration.py adds the gyroscope/bias_{x,y,z}
# config keys this file sets to sensorfw's own hybrisgyroscopeadaptor -- see that patch's own
# docstring for the full story (including why CSD's own proprietary calibration tooling was
# not an option: /usr/lib/sensor-calibration/calibrate_* was never shipped for this device).
#
# Since sensorfwd itself (patches/patch-sensorfw-gyro-autocal.py)
# now auto-calibrates live, continuously, in-process -- the same shape as this platform's own
# magnetometer calibration (chains/magcalibrationchain) -- and rewrites this exact file on-device
# whenever it converges a meaningfully different estimate. No separate tool needed to re-measure;
# it happens on its own any time the device is stationary for a few seconds. The values below are
# only the initial seed for a fresh device/rebuild (measured live on this specific physical
# device on 2026-09-29) -- sensorfwd will refine them from here, not treat them as final.
[gyroscope]
bias_x = 0.2180
bias_y = 0.4271
bias_z = -2.2486
