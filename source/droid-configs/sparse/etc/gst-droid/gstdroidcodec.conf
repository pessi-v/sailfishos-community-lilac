# lilac-v2: enable hardware HEVC (H.265) decoding in gst-droid's droidvdec.
#
# droid-configs-device ships this exact [decoders] switch in its sparse-13 and sparse-14
# trees, but not for the Android 11 base this port builds on, so droidvdec never advertised
# video/x-h265 and every HEVC file failed with "No decoder available for type video/x-h265"
# The Android side has the decoders already:
# OMX.qcom.video.decoder.hevc (Venus) and OMX.google.hevc.decoder.
#
# Only the [decoders] switch is copied; the [decoder-quirks] section from sparse-13/14 is
# deliberately left out so H.264/MPEG-4 playback, which works, isn't changed.
[decoders]
video/hevc=1
