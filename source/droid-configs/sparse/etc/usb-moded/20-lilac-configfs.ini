# The lilac kernel has no mass_storage gadget function, which usb-moded uses for its charging-only gadget: without a replacement
# charging mode fails ("failed to activate charging, all bets are off") and every later mode switch is disturbed.
# midi.gs5 is created by Android's init, needs no userspace helper, and lets the gadget enumerate so a host grants full charging current.
[configfs]
function_mass_storage = midi.gs5
