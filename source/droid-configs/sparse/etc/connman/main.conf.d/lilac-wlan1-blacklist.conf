[General]
# lilac's qcacld WLAN driver exposes two station-capable
# netdevs off one physical radio (phy0) -- wlan0 (real hardware MAC) and wlan1 (a second,
# differently-MAC'd interface). connman's default NetworkInterfaceBlacklist doesn't exclude
# wlan1, so it manages both simultaneously; wpa_supplicant then runs independent scan/sched-scan
# cycles on each, and since they share one radio every attempt on one collides with the other
# ("wlan0/wlan1: Failed to initiate sched scan", endlessly, on both interfaces, no scan ever
# actually completing on either). Blacklisting wlan1 leaves wlan0 as the sole managed interface;
# confirmed live that scanning then succeeds and returns real AP results immediately.
NetworkInterfaceBlacklist = ifb,p2p,usb,rmnet,rev_rmnet,wlan1
