# lilac-v2: never pick gst-droid's AAC decoder; use the software one (gst-libav avdec_aac).
#
# droidadec creates c2.android.aac.decoder, which rejects every frame of every AAC stream on
# this build ("C2SoftAacDec: Invalid AAC stream", decoderErr = 0x1001), so any video or audio
# file with AAC audio failed to play. Demoting droidadec to rank 0 makes playbin pick avdec_aac
# instead; verified with H.264+AAC clips and the phone's own camera recordings
# Root cause in droidadec/droidmedia is not found yet; remove
# this once it is.
#
# Read by the user session like 50-jolla-ui.conf and 60-multimedia.conf in this directory.
GST_PLUGIN_FEATURE_RANK=droidadec:0
